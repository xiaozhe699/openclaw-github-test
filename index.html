<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>倒计时</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --card: rgba(15, 23, 42, 0.72);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #22c55e;
        --accent-2: #38bdf8;
        --danger: #fb7185;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(56, 189, 248, 0.18), transparent 30%),
          radial-gradient(circle at bottom, rgba(34, 197, 94, 0.16), transparent 25%),
          var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 24px;
      }

      .card {
        width: min(680px, 100%);
        background: var(--card);
        backdrop-filter: blur(18px);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 24px;
        padding: 28px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(28px, 4vw, 42px);
      }

      .subtitle {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.6;
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      label {
        font-size: 14px;
        color: var(--muted);
      }

      input {
        width: 100%;
        border: 1px solid rgba(148, 163, 184, 0.24);
        background: rgba(15, 23, 42, 0.85);
        color: var(--text);
        border-radius: 14px;
        padding: 14px 16px;
        font-size: 16px;
        outline: none;
      }

      input:focus {
        border-color: var(--accent-2);
        box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.12);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 18px;
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 13px 20px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.18s ease, opacity 0.18s ease;
      }

      button:hover { transform: translateY(-1px); }
      button:active { transform: translateY(0); }

      .primary {
        background: linear-gradient(135deg, var(--accent), #16a34a);
        color: white;
      }

      .secondary {
        background: rgba(148, 163, 184, 0.14);
        color: var(--text);
      }

      .danger {
        background: rgba(251, 113, 133, 0.15);
        color: #fecdd3;
      }

      .countdown {
        margin-top: 28px;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }

      .time-box {
        padding: 18px 12px;
        border-radius: 18px;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.16);
        text-align: center;
      }

      .time-value {
        display: block;
        font-size: clamp(28px, 5vw, 46px);
        font-weight: 700;
        letter-spacing: 1px;
      }

      .time-label {
        display: block;
        margin-top: 6px;
        color: var(--muted);
        font-size: 13px;
      }

      .status {
        margin-top: 18px;
        min-height: 24px;
        color: var(--muted);
      }

      .status.done {
        color: #86efac;
      }

      @media (max-width: 640px) {
        .controls {
          grid-template-columns: 1fr;
        }

        .countdown {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>倒计时页面</h1>
      <p class="subtitle">输入一个目标时间和标题，就能开始倒计时。页面会实时显示剩余的天、时、分、秒。</p>

      <section class="controls">
        <div class="field full">
          <label for="title">事件标题</label>
          <input id="title" type="text" placeholder="比如：新品发布 / 放假 / 生日" value="我的重要时刻" />
        </div>

        <div class="field full">
          <label for="targetTime">目标时间</label>
          <input id="targetTime" type="datetime-local" />
        </div>
      </section>

      <div class="actions">
        <button class="primary" id="startBtn">开始倒计时</button>
        <button class="secondary" id="presetBtn">设为 24 小时后</button>
        <button class="danger" id="resetBtn">重置</button>
      </div>

      <section class="countdown" aria-live="polite">
        <div class="time-box">
          <span class="time-value" id="days">00</span>
          <span class="time-label">天</span>
        </div>
        <div class="time-box">
          <span class="time-value" id="hours">00</span>
          <span class="time-label">时</span>
        </div>
        <div class="time-box">
          <span class="time-value" id="minutes">00</span>
          <span class="time-label">分</span>
        </div>
        <div class="time-box">
          <span class="time-value" id="seconds">00</span>
          <span class="time-label">秒</span>
        </div>
      </section>

      <p class="status" id="status">还没开始。先选一个未来时间吧。</p>
    </main>

    <script>
      const titleInput = document.getElementById('title');
      const targetTimeInput = document.getElementById('targetTime');
      const startBtn = document.getElementById('startBtn');
      const presetBtn = document.getElementById('presetBtn');
      const resetBtn = document.getElementById('resetBtn');
      const statusEl = document.getElementById('status');
      const daysEl = document.getElementById('days');
      const hoursEl = document.getElementById('hours');
      const minutesEl = document.getElementById('minutes');
      const secondsEl = document.getElementById('seconds');

      let timer = null;
      let targetDate = null;

      const setValues = (days, hours, minutes, seconds) => {
        daysEl.textContent = String(days).padStart(2, '0');
        hoursEl.textContent = String(hours).padStart(2, '0');
        minutesEl.textContent = String(minutes).padStart(2, '0');
        secondsEl.textContent = String(seconds).padStart(2, '0');
      };

      const resetValues = () => setValues(0, 0, 0, 0);

      const updateCountdown = () => {
        if (!targetDate) return;

        const now = new Date();
        const diff = targetDate.getTime() - now.getTime();
        const title = titleInput.value.trim() || '目标事件';

        if (diff <= 0) {
          clearInterval(timer);
          timer = null;
          resetValues();
          statusEl.textContent = `「${title}」时间到啦。`;
          statusEl.classList.add('done');
          return;
        }

        statusEl.classList.remove('done');
        const totalSeconds = Math.floor(diff / 1000);
        const days = Math.floor(totalSeconds / 86400);
        const hours = Math.floor((totalSeconds % 86400) / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        setValues(days, hours, minutes, seconds);
        statusEl.textContent = `距离「${title}」还有 ${days} 天 ${hours} 小时 ${minutes} 分 ${seconds} 秒`;
      };

      const startCountdown = () => {
        if (!targetTimeInput.value) {
          statusEl.textContent = '先选择一个目标时间。';
          statusEl.classList.remove('done');
          return;
        }

        const selected = new Date(targetTimeInput.value);
        if (Number.isNaN(selected.getTime())) {
          statusEl.textContent = '目标时间格式不对，请重新选择。';
          statusEl.classList.remove('done');
          return;
        }

        if (selected.getTime() <= Date.now()) {
          statusEl.textContent = '目标时间要在未来。';
          statusEl.classList.remove('done');
          return;
        }

        targetDate = selected;
        if (timer) clearInterval(timer);
        updateCountdown();
        timer = setInterval(updateCountdown, 1000);
      };

      const setPreset = () => {
        const nextDay = new Date(Date.now() + 24 * 60 * 60 * 1000);
        const offset = nextDay.getTimezoneOffset();
        const local = new Date(nextDay.getTime() - offset * 60000)
          .toISOString()
          .slice(0, 16);
        targetTimeInput.value = local;
        statusEl.textContent = '已帮你设成 24 小时后，点“开始倒计时”即可。';
        statusEl.classList.remove('done');
      };

      const resetCountdown = () => {
        if (timer) clearInterval(timer);
        timer = null;
        targetDate = null;
        titleInput.value = '我的重要时刻';
        targetTimeInput.value = '';
        resetValues();
        statusEl.textContent = '已重置。重新设置一个目标时间吧。';
        statusEl.classList.remove('done');
      };

      startBtn.addEventListener('click', startCountdown);
      presetBtn.addEventListener('click', setPreset);
      resetBtn.addEventListener('click', resetCountdown);
      resetValues();
    </script>
  </body>
</html>
